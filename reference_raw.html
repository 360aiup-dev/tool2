        function getDeviceId() {\
            let id = localStorage.getItem('device_id');\

        const modal = document.getElementById('password-modal');\
        const passwordForm = document.getElementById('password-form');\

        function showModal() {\
            modal.classList.add('active');\
            passwordInput.value = '';\
            passwordInput.focus();\

        function closeModal() {\
            modal.classList.remove('active');\
            const loadingDiv = document.getElementById('loading-state');\
            const placeholderDiv = document.getElementById('result-placeholder');\
            const resultDiv = document.getElementById('ai-result');\
            const resultHeader = document.getElementById('ai-result-header');\

            loadingDiv.classList.add('hidden');\

            if (resultDiv.innerHTML.trim() === '') {\

                 if(resultHeader) resultHeader.classList.add('hidden');\

                 resultDiv.classList.remove('hidden');\
                 if(resultHeader) resultHeader.classList.remove('hidden');\
            }\

        passwordForm.addEventListener('submit', function(e) {\
            e.preventDefault();\

                callAI(pendingPrompt, password);\
                modal.classList.remove('active');\

        });\

        \
        let currentAiResponse = '';\

        \
        function callAI(prompt, password = null) {\
            const resultDiv = document.getElementById('ai-result');\
            const loadingDiv = document.getElementById('loading-state');\
            const placeholderDiv = document.getElementById('result-placeholder');\
            const resultHeader = document.getElementById('ai-result-header');\

            placeholderDiv.classList.add('hidden');\

            if(resultHeader) resultHeader.classList.add('hidden');\
            loadingDiv.classList.remove('hidden');\
            loadingDiv.classList.add('flex');\
\
            google.script.run\
                .withSuccessHandler(function(responseText) {\
                    loadingDiv.classList.add('hidden');\
                    loadingDiv.classList.remove('flex');\
                    resultDiv.classList.remove('hidden');\
                    if(resultHeader) resultHeader.classList.remove('hidden');\
                    \
                    currentAiResponse = responseText;\
                    resultDiv.innerHTML = marked.parse(responseText);\
                    pendingPrompt = null;\
                })\
                .withFailureHandler(function(error) {\
                    if (error.message && error.message.includes(\"LIMIT_REACHED\")) {\
                        pendingPrompt = prompt;\
                        showModal();\
                    } else if (error.message && error.message.includes(\"PASSWORD_INVALID\")) {\
                         alert(\"密碼錯誤，請重新輸入。\");\
                         pendingPrompt = prompt;\
                         showModal();\
                    } else {\
                        console.error(error);\
                        loadingDiv.classList.add('hidden');\
                        loadingDiv.classList.remove('flex');\
                        resultDiv.classList.remove('hidden');\
                        if (resultDiv.innerHTML.trim() === '' && resultHeader) {\
                            resultHeader.classList.add('hidden');\
                        }\
                        resultDiv.innerHTML = `<p class=\"text-red-400\">系統忙碌中，請稍後再試。<br>錯誤訊息: ${error.message}<\\/p>`;\
                    }\
                })\
                .callGeminiServerSide(prompt, deviceId, password);\
        }\
